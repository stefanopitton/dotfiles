# Flow colorscheme | Tmux
# https://github.com/0xstepit/flow.nvim

## Colors

set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g default-terminal "tmux-256color"

## Extended keys
# Ghostty speaks the Kitty keyboard protocol, but tmux swallows modified keys
# unless extended-keys is enabled. Without this, <C-CR>/<S-CR> arrive as a plain
# <CR> and cannot be mapped (ipynb.nvim binds cell execution to <C-CR>).
set -s extended-keys on
set -s extended-keys-format csi-u
# `tmux-256color` terminfo carries no RGB capability, so state true colour
# explicitly instead of relying on tmux autodetecting it from Ghostty.
set -as terminal-features 'xterm-ghostty:extkeys:RGB'

source "$HOME/.config/tmux/flow-eclipse.conf"

## ================================================================================================
## Numbering
## ================================================================================================

# Set tmux windows numbers to start from 1.
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on # renumber windows without gaps

## ================================================================================================
## History
## ================================================================================================

set-option -g history-limit 50000

## ================================================================================================
## Behaviour
## ================================================================================================

# Forward terminal focus events to the pane. Neovim needs these for FocusGained
# /FocusLost (autoread, autosave) and for vim-tmux-navigator's edge detection.
set -g focus-events on

# Emit OSC 52 ourselves instead of only forwarding it, so yanks from Neovim
# inside tmux reach the system clipboard - including over SSH.
set -g set-clipboard on

# Killing a session drops us into the next one instead of detaching entirely.
set -g detach-on-destroy off

## ================================================================================================
## Remap
## ================================================================================================

# Change prefix to Ctrl-space.
# TODO: consider keeping original C-b binding for standardized key.
set -g prefix C-Space
unbind C-b

bind " " next-layout # rotate panes layout
bind u select-layout -o
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..." # reload config

# Unbind and remap split window to open in current directory
unbind '"'
bind - split-window -v -c "#{pane_current_path}" # vertical split
unbind %
bind '\' split-window -h -c "#{pane_current_path}" # horizontal split

# Resize panes (-r is to make it repeatable by holding the key).
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

## ================================================================================================
## Movements
## ================================================================================================

bind '/' last-window # go to last visited window

# Move the current window left/right in the window list.
bind -r C-p swap-window -t -1 \; select-window -t -1
bind -r C-n swap-window -t +1 \; select-window -t +1

# Enable mouse and dragging.
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

# Enable vim motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Y send-keys -X start-of-line \; send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel "pbcopy" # yank whole line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle # block selection
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# These mapping should be accompanied with the nvim keymaps.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l' # switch to revious pane

# Beam and block cursor style.
set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Required for images in terminal.
set -gq allow-passthrough on

# Custom scripts
bind-key p display-popup -E "~/.local/bin/tmux-sessionizer"
bind-key f display-popup -E "~/.local/bin/tmux-panes-picker"

bind-key t display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch" # persistent scratch session
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

## ================================================================================================
## Plugins
## ================================================================================================

# Plugins manager.
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore tmux session after restarting the machine.
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
run '~/.config/tmux/plugins/tpm/tpm'
